# =============================================================================
# ARCHIVO DE CONFIGURACIÓN PARA REDIS CACHE CLEANER
# =============================================================================

# Configuración de túnel SSH (opcional)
USE_SSH_TUNNEL=true
SSH_HOST=bastion.your-domain.com
SSH_USER=ec2-user
SSH_KEY=/path/to/your/key.pem
LOCAL_PORT=6380

# Configuración de Kubernetes
K8S_CONTEXT=production-cluster
K8S_NAMESPACE=redis-namespace
K8S_POD_NAME=redis-master-0
K8S_CONTAINER_NAME=redis

# Configuración de Redis
REDIS_HOST=redis-service.redis-namespace.svc.cluster.local
REDIS_PORT=6379
REDIS_PASSWORD=your-redis-password
REDIS_DB=0

# Variables de patrones comunes (opcional)
# COMMON_PATTERNS="cache:*,session:*,temp:*"
# COMMON_WORDS="user_session,api_cache"
