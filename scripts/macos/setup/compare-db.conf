# =============================================================================
# ARCHIVO DE CONFIGURACIÓN PARA SINCRONIZACIÓN DE ESQUEMAS
# =============================================================================

# Configuración de base de datos FUENTE
SOURCE_TYPE=remote                      # local o remote
SOURCE_HOST=your-rds-instance.amazonaws.com
SOURCE_PORT=5432
SOURCE_DB=production_db
SOURCE_USER=postgres
SOURCE_SCHEMA=public

# Configuración SSH para base de datos fuente (solo si SOURCE_TYPE=remote)
SOURCE_SSH_HOST=bastion-1.your-domain.com
SOURCE_SSH_USER=ec2-user
SOURCE_SSH_KEY=/path/to/your/key.pem
SOURCE_LOCAL_PORT=5433

# Configuración de base de datos DESTINO
TARGET_TYPE=remote                      # local o remote
TARGET_HOST=your-other-rds.amazonaws.com
TARGET_PORT=5432
TARGET_DB=staging_db
TARGET_USER=postgres
TARGET_SCHEMA=public

# Configuración SSH para base de datos destino (solo si TARGET_TYPE=remote)
TARGET_SSH_HOST=bastion-2.your-domain.com
TARGET_SSH_USER=ec2-user
TARGET_SSH_KEY=/path/to/your/other-key.pem
TARGET_LOCAL_PORT=5434

# Configuración adicional
APPLY_TO_ALL_SCHEMAS=true               # true para aplicar a todos los esquemas
DRY_RUN=false                          # true para modo prueba (no ejecutar cambios)

# Variables de contraseña (se pedirán interactivamente si no se establecen)
# SOURCE_PASS=your_source_password
# TARGET_PASS=your_target_password
